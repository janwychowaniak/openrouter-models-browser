[project]
name = "ormodels"
version = "0.1.0"
description = "CLI for browsing and comparing AI models from the OpenRouter API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Wychowaniak" }]
keywords = ["openrouter", "ai", "llm", "cli", "models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "tabulate>=0.9",
    "pyyaml>=6.0",
]

[project.scripts]
ormodels = "ormodels.cli:main"

[project.urls]
Homepage = "https://github.com/janwychowaniak/openrouter-models-browser"
Issues = "https://github.com/janwychowaniak/openrouter-models-browser/issues"
Source = "https://github.com/janwychowaniak/openrouter-models-browser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ormodels"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-requests",
    "types-PyYAML",
    "types-tabulate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
